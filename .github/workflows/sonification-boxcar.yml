name: Sonification boxcar parity
on:
  push:
    paths:
      - 'SONIFICATION/sonify_v1.2.py'
      - 'SONIFICATION/tests/**'
      - 'SONIFICATION/benchmarks/**'
      - '.github/workflows/sonification-boxcar.yml'
  pull_request:
    paths:
      - 'SONIFICATION/sonify_v1.2.py'
      - 'SONIFICATION/tests/**'
      - 'SONIFICATION/benchmarks/**'
      - '.github/workflows/sonification-boxcar.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        numpy: ['2.2.6', '2.3.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==${{ matrix.numpy }} scipy==1.17.0
      - run: python -m unittest discover -s SONIFICATION/tests -v
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
